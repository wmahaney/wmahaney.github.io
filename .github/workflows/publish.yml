name: Build and publish site

# - Every push to any branch builds the site (so a broken page is caught early).
# - Only pushes to `main` publish it to https://wmahaney.github.io.
# - The `private` branch builds with drafts shown and is never published.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # THE CV. cv/cv.tex is the one source of the CV (see cv/README.md). When it exists,
      # compile it and put the PDF where the site serves it, cv_william_mahaney.pdf.
      # When it does not exist, these steps are skipped and the PDF already in the
      # repository is used. A LaTeX error fails the build, so nothing is published.
      - name: Is there a cv/cv.tex?
        id: cv
        run: |
          if [ -f cv/cv.tex ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # TeX Live 2025 (a frozen release), through the action at a fixed commit
      # (xu-cheng/latex-action v4.1.0). pdfLaTeX unless cv/.latexmkrc sets $pdf_mode.
      - name: Compile the CV
        if: steps.cv.outputs.present == 'true'
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          texlive_version: "2025"
          working_directory: cv
          root_file: cv.tex
          # "-e $pdf_mode||=1" means: pdfLaTeX, unless cv/.latexmkrc chose an engine.
          # (No spaces inside it: the action splits these arguments at spaces.)
          args: "-e $pdf_mode||=1 -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build"

      - name: Put the compiled CV in place
        if: steps.cv.outputs.present == 'true'
        run: cp cv/build/cv.pdf cv_william_mahaney.pdf

      - name: Keep the LaTeX log when the CV fails to compile
        if: failure() && steps.cv.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cv-latex-log
          path: |
            cv/build/*.log
            cv/*.log
          if-no-files-found: ignore
          retention-days: 14

      # The random walk on the isogeny graphs is built by assets/js/walk.js; these tests
      # check its transition matrix against the graph data. Node is already on the runner.
      - name: Test the random-walk code
        run: node --test _tests/*.test.mjs

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The "private" branch builds with the private profile (drafts and the Statements
      # menu shown). Every other branch, including main, builds the public site.
      - name: Render the site
        run: quarto render ${{ github.ref == 'refs/heads/private' && '--profile private' || '' }}

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # PREVIEW: on branches other than main, also attach the built site as a plain
      # download (Actions run page -> Artifacts -> "site-preview"). Unzip it and open
      # index.html to look at the site before merging.
      - name: Upload a downloadable preview copy (branches only)
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/private'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 14

      # PRIVATE TEST BUILD: the "private" branch is never deployed. Its built site,
      # drafts included, is attached as "site-private" (Actions run page -> Artifacts).
      - name: Upload the private test build (private branch only)
        if: github.ref == 'refs/heads/private'
        uses: actions/upload-artifact@v4
        with:
          name: site-private
          path: _site
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
