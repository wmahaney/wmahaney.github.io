# PUBLIC PROFILE: the site everyone sees at https://wmahaney.github.io
# Used by default (see "profile:" in _quarto.yml), so main always builds with it.
# Draft pages ("draft: true") are left out, and the menu has no Statements tab.
website:
  draft-mode: gone
  navbar:
    left:
      # The name at the left of the menu links to the home page.
      - href: research/index.qmd
        text: Research
      - text: Writing
        menu:
          - href: blog/index.qmd
            text: Blog
          - href: notes/index.qmd
            text: Expository Notes
      # CODE. One "href" entry per live tool in code/projects.yml, each going to that
      # tool's section of the Basic Tools page.
      - text: Code
        menu:
          - href: code/index.qmd
            text: Overview
          - text: "---"
          - text: "Basic Tools"
          - href: code/basic-tools.qmd#cropmark
            text: cropmark
          - href: code/basic-tools.qmd#travel-notes
            text: travel_notes
      - text: Animations
        menu:
          - href: animations/walks.qmd
            text: Random walks
          - href: animations/balls.qmd
            text: Blooming
          - href: animations/spectral.qmd
            text: Spectral law
          - href: animations/about.qmd
            text: Read more
      # STATEMENTS: hidden from the public for now. To show it, copy the "Statements"
      # entry from _quarto-private.yml to this spot, and delete "draft: true" in each
      # statement you list.
      - href: teaching/index.qmd
        text: Teaching
      # The AI tab appears here once ai/index.qmd is no longer a draft.
      - href: ai/index.qmd
        text: AI
      - href: cv/index.qmd
        text: CV
