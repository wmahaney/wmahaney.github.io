title: "William E. Mahaney"
author: "William E. Mahaney"
email: "mahaney1@vt.edu"
github_username: wmahaney
description: "Mathematics PhD student at Virginia Tech working on supersingular isogeny graphs, number theory, and post-quantum cryptography."
url: "https://wmahaney.github.io"
baseurl: ""

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

# Blog posts load MathJax; any other page can opt in with `math: true`.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      math: true

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

header_pages:
  - research.md
  - teaching.md
  - cv.md
  - blog.md

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
