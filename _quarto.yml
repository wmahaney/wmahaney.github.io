# Build profiles. "public" is used unless another is named, e.g.
#   quarto render --profile private
profile:
  default: public

project:
  type: website
  output-dir: _site
  # Files copied to the published site as-is (PDFs, images, slides, ...).
  # Anything you drop into files/ or images/ is published automatically.
  resources:
    - cv_william_mahaney.pdf
    - "files/**"
    - "images/**"
    # Script and data for the isogeny graphs on the home page.
    - "assets/js/**"
    - "assets/data/**"
    - "!**/_UPLOAD_HERE.md"

lang: en

website:
  title: "William E. Mahaney"
  site-url: "https://wmahaney.github.io"
  description: "Mathematics PhD student at Virginia Tech working on supersingular isogeny graphs, number theory, and post-quantum cryptography."
  favicon: images/favicon.svg
  # Picture shown when a link to the site is shared (1200 x 630).
  image: images/social-card.png
  image-alt: "William E. Mahaney, with a drawing of a supersingular 2-isogeny graph."
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  back-to-top-navigation: true
  navbar:
    title: "William E. Mahaney"
    # The menu items ("left:") are set per build profile:
    #   _quarto-public.yml   the public site (the default; used for main)
    #   _quarto-private.yml  private builds (the "private" branch), with Statements
    # The icon links at the right of the menu. "text" is what a screen reader reads and
    # what appears when the pointer rests on the icon.
    tools:
      - icon: envelope
        href: "mailto:mahaney1@vt.edu"
        text: "Email William Mahaney"
      - icon: github
        href: "https://github.com/wmahaney"
        text: "William Mahaney on GitHub"
  page-footer:
    left: "William E. Mahaney · Virginia Tech"
    right: "mahaney1@vt.edu"

# ARXIV AND ORCID LINKS. Fill in an id between the quotes and its link appears in the
# menu bar (next to Email and GitHub), on the home page and on the CV page. While an id
# is empty, that link is not shown anywhere.
#   arxiv-author  your arXiv author identifier, the last part of https://arxiv.org/a/<id>
#                 (it looks like  surname_x_1 ; set one up at arxiv.org -> your account)
#   orcid         your ORCID iD, in the form 0000-0000-0000-0000
profile-links:
  arxiv-author: ""
  orcid: ""

filters:
  # Drops <!-- editing notes --> from the published pages.
  - assets/strip-comments.lua
  # Writes the arXiv and ORCID links set just above.
  - assets/profile-links.lua

format:
  html:
    # Light theme first; Quarto adds the light/dark toggle to the navbar
    # automatically because both are defined.
    theme:
      light: [default, assets/theme-light.scss]
      dark: [default, assets/theme-dark.scss]
    css: assets/styles.css
    include-in-header: assets/head.html
    html-math-method: mathjax
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    toc-depth: 3
    grid:
      body-width: 820px
      margin-width: 250px
      gutter-width: 2rem
